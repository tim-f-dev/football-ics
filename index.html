<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Fußball Kalender</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 900px;
      margin: 50px auto;
      padding: 20px;
      text-align: center;
    }

    .calendar-container {
      display: flex;
      gap: 30px;
      align-items: flex-start;
    }

    .calendar-section {
      flex: 1;
    }

    .button {
      display: block;
      padding: 14px;
      margin: 12px 0;
      border-radius: 8px;
      background: #2365b0;
      color: white;
      text-decoration: none;
      font-size: 16px;
      border: none;
      cursor: pointer;
      width: 100%;
      box-sizing: border-box;
    }

    .button:hover {
      background: #174b86;
    }

    .secondary {
      background: #eeeeee;
      color: #222222;
    }

    .secondary:hover {
      background: #dddddd;
    }

    .message {
      color: green;
      font-size: 14px;
      min-height: 20px;
    }

    @media (max-width: 700px) {
      .calendar-container {
        flex-direction: column;
      }

      .calendar-section {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <h1>Fußball Kalender</h1>

  <p>
    Abonniere die Spielpläne.
    Die Kalender werden automatisch aktualisiert mit den Daten von fussball.de.
  </p>

  <div class="calendar-container">

    <!-- FCN -->
    <section class="calendar-section">

      <h2>FCN Heimspiele</h2>

      <a
        class="button"
        href="webcal://tim-f-dev.github.io/football-ics/FCN-Heim.ics"
      >
        Apple Calendar
      </a>

      <a
        class="button"
        href="https://calendar.google.com/calendar/embed?src=6ddh1okj22mtgd09gj55hh951j9hcag6%40import.calendar.google.com&ctz=Europe%2FBerlin"
        target="_blank"
        rel="noopener noreferrer"
      >
        Google Calendar
      </a>

      <button
        class="button secondary"
        onclick="copyLink('https://tim-f-dev.github.io/football-ics/FCN-Heim.ics', 'fcn-message')"
      >
        ICS-Link kopieren
      </button>

      <p id="fcn-message" class="message"></p>

    </section>

    <!-- FCK -->
    <section class="calendar-section">

      <h2>FCK Spiele</h2>

      <a
        class="button"
        href="webcal://tim-f-dev.github.io/football-ics/FCK.ics"
      >
        Apple Calendar
      </a>

      <a
        class="button"
        href="https://calendar.google.com/calendar/embed?src=ovddtq3r0p74r9q44l2alfqvh7cr7093%40import.calendar.google.com&ctz=Europe%2FBerlin"
        target="_blank"
        rel="noopener noreferrer"
      >
        Google Calendar
      </a>

      <button
        class="button secondary"
        onclick="copyLink('https://tim-f-dev.github.io/football-ics/FCK.ics', 'fck-message')"
      >
        ICS-Link kopieren
      </button>

      <p id="fck-message" class="message"></p>

    </section>

  </div>

  <script>
    async function copyLink(url, messageId) {
      const message = document.getElementById(messageId);

      try {
        await navigator.clipboard.writeText(url);
        message.textContent = "ICS-Link kopiert!";
      } catch {
        message.textContent = "Kopieren fehlgeschlagen: " + url;
      }
    }
  </script>

</body>
</html>
